<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .stage canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      background: #000;
      outline: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      color: #ddd;
      font: 16px/1.4 system-ui, sans-serif;
      text-align: center;
    }
    .bar {
      width: 220px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      width: 0%;
      height: 100%;
      background: #ddd;
    }
    .fs-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      padding: 6px;
      line-height: 0;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.4;
    }
    .fs-btn:hover {
      opacity: 1;
    }
    .stage:fullscreen .fs-btn {
      display: none;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div class="overlay" id="loading">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
    <div class="overlay hidden" id="message"></div>
    <button class="fs-btn hidden" id="fs-btn" title="Fullscreen" aria-label="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var message = document.getElementById("message");
    var barFill = document.getElementById("bar-fill");
    var fsBtn = document.getElementById("fs-btn");

    function showMessage(html) {
      loading.classList.add("hidden");
      message.innerHTML = html;
      message.classList.remove("hidden");
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      showMessage("This game needs a keyboard and mouse.<br>Open it in a desktop browser.");
    } else {
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        fullscreenElementID: "stage",
        showBanner: function (msg, type) {
          if (type === "error") showMessage(msg);
          else console.warn(msg);
        }
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          barFill.style.width = (100 * progress) + "%";
        }).then(function (unityInstance) {
          loading.classList.add("hidden");
          fsBtn.classList.remove("hidden");
          fsBtn.onclick = function () {
            unityInstance.SetFullscreen(1);
            fsBtn.blur();
            canvas.focus();
          };
        }).catch(function (err) {
          showMessage("Failed to load the game.<br>" + err);
        });
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
